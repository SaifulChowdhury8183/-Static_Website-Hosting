<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Not Found</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff3f3;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background: #e53935;
      color: white;
      padding: 20px 0;
    }
    h1 {
      margin: 0;
    }
    main {
      padding: 40px;
    }
    a {
      color: #e53935;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>404 Error</h1>
  </header>
  <main>
    <p>Oops! The page you’re looking for doesn’t exist.</p>
    <a href="index.html">Return to Home</a>
  </main>
</body>
</html>
